services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: betterbankings
      POSTGRES_USER: bb_user
      POSTGRES_PASSWORD: bb_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data # No host port needed — api connects via internal Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb_user -d betterbankings"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8002:8002"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: bb_user
      DB_PASSWORD: bb_secure_pass
      DB_NAME: betterbankings
      UPLOAD_DIR: /var/www/uploads
      PORT: "8002"
    volumes:
      - uploads:/var/www/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
